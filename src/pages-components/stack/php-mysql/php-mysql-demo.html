<div class="php-mysql-demo">


    <!--  -----  Hero  -----  -->
    <div class="php-mysql-page__hero">
        <div class="php-mysql-page__hero-badge">
            <span class="php-mysql-page__hero-tag" aria-hidden="true">SQL</span>
            <h3 class="php-mysql-page__hero-title">Consulta</h3>
            <p class="php-mysql-page__hero-subtitle">Demo de scripts SPA</p>
        </div>
    </div>


    <!--  -----  Estado del script clásico  -----  -->
    <p class="php-mysql-page__intro-text" data-php-mysql-cjs-status>
        Esperando php-mysql-page.cjs.js…
    </p>


    <!--  -----  Formulario de consulta  -----  -->
    <section class="php-mysql-page__features">

        <h3 class="php-mysql-page__features-title">Ejecutar consulta</h3>

        <form class="php-mysql-page__form" data-php-mysql-query-form>

            <label class="php-mysql-page__label" for="phpMysqlQuerySql">Consulta SQL</label>

            <textarea
                id="phpMysqlQuerySql"
                class="php-mysql-page__sql"
                name="sql"
                rows="6"
                spellcheck="false"
                required
            >SELECT id, slug, title, path, sort_order
FROM stacks
ORDER BY sort_order;</textarea>

            <button class="php-mysql-page__submit" type="submit">Ejecutar consulta</button>

        </form>

        <p class="php-mysql-page__status" data-php-mysql-status role="status"></p>

        <div class="php-mysql-page__result" data-php-mysql-result></div>

    </section>

</div>
