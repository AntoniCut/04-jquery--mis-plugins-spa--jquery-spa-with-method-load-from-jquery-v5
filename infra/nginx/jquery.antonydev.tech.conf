# ==============================================================
#  nginx — site file de jquery.antonydev.tech
#  --------------------------------------------------------------
#  - Va completo en /etc/nginx/sites-available/jquery.antonydev.tech
#    con symlink en sites-enabled. NO es un fragmento.
#  - El API Node se incluye desde:
#      /etc/nginx/snippets/jquery.antonydev.tech-api.conf
#    El origen versionado es infra/nginx/jquery.antonydev.tech-api.conf.
#  - El bloque de v5 también está en
#    jquery.antonydev.tech-mis-plugins-spa.conf.
#  - `http2 on;` es la sintaxis vigente; `listen ... http2` está
#    deprecada desde nginx 1.25.1.
#  - No hay location ^~ /api/ en la raíz del dominio.
#  - Aplicar a mano en el VPS, en este orden:
#      cp -a <site> <site>.bak.$(date +%F-%H%M%S)
#      copiar el fragmento del API a /etc/nginx/snippets/
#      reemplazar el site file
#      nginx -t && systemctl reload nginx
#  - Este archivo también sirve la raíz Astro, v4, udemy y escuelait.
# ==============================================================

server {
    listen 80;
    server_name jquery.antonydev.tech;

    # Redirigir todo el tráfico HTTP a HTTPS
    return 301 https://$host$request_uri;
}

server {

    listen 443 ssl; # managed by Certbot
    http2 on;
    #listen 443 ssl;
    server_name jquery.antonydev.tech;

    ssl_certificate /etc/letsencrypt/live/jquery.antonydev.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jquery.antonydev.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
    include snippets/deny-dotfiles.conf;

    root /var/www/jquery.antonydev.tech/jquery-main-project-with-astro;

    # ----------------------
    # -----  llms.txt  -----
    # ----------------------

    location ~ \.\w+$ {
        try_files $uri =404;
    }

    #  ---------------------------------------------------------------------------  #
    #  -----  jquery.antonydev.tech/  -----  jquery-main-project-whit-astro  -----  #
    #  ---------------------------------------------------------------------------  #

    location / {
        try_files $uri $uri/ /index.html;
    }

    #  ----------------------------------------------------------------------------------------------  #
    #  -----  jquery.antonydev.tech/mis-plugins-spa/jquery-spa-with-method-load-from-jquery-v4  -----  #
    #  ----------------------------------------------------------------------------------------------  #

    location = /mis-plugins-spa/jquery-spa-with-method-load-from-jquery-v4 {
        return 301 /mis-plugins-spa/jquery-spa-with-method-load-from-jquery-v4/;
    }

    location ^~ /mis-plugins-spa/jquery-spa-with-method-load-from-jquery-v4/ {

        root /var/www/jquery.antonydev.tech;
        try_files $uri $uri/ /mis-plugins-spa/jquery-spa-with-method-load-from-jquery-v4/index.html;
        include snippets/deny-dotfiles.conf;

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_param QUERY_STRING    $query_string;
        }
    }

    #  ----------------------------------------------------------------------------------------------  #
    #  -----  jquery.antonydev.tech/mis-plugins-spa/jquery-spa-with-method-load-from-jquery-v5  -----  #
    #  ----------------------------------------------------------------------------------------------  #

    location = /mis-plugins-spa/jquery-spa-with-method-load-from-jquery-v5 {
        return 301 /mis-plugins-spa/jquery-spa-with-method-load-from-jquery-v5/;
    }

    # -----  API Node  -----  #
    include /etc/nginx/snippets/jquery.antonydev.tech-api.conf;

    location ^~ /mis-plugins-spa/jquery-spa-with-method-load-from-jquery-v5/ {

        root /var/www/jquery.antonydev.tech;
        try_files $uri $uri/ /mis-plugins-spa/jquery-spa-with-method-load-from-jquery-v5/index.html;
        include snippets/deny-dotfiles.conf;

        location ~ /\.env {
            deny all;
            return 404;
        }

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_param QUERY_STRING    $query_string;
        }
    }

    #  ------------------------------------------  #
    #  -----  jquery.antonydev.tech/udemy/  -----  #
    #  ------------------------------------------  #

    location /udemy/ {
        alias /var/www/jquery.antonydev.tech/udemy/;
        try_files $uri $uri/ /udemy/index.html;
    }

    #  ----------------------------------------------  #
    #  -----  jquery.antonydev.tech/escuelait/  -----  #
    #  ----------------------------------------------  #

    location = /escuelait/curso-jquery-escuelait {
        try_files /escuelait/curso-jquery-escuelait/index.html =404;
    }

    location ^~ /escuelait/curso-jquery-escuelait/ {

        root /var/www/jquery.antonydev.tech;
        try_files $uri $uri/ /escuelait/curso-jquery-escuelait/index.html;
        include snippets/deny-dotfiles.conf;

        location ~ /\.env {
            deny all;
            return 404;
        }

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_param QUERY_STRING    $query_string;
        }
    }

    #  ------------------------  #
    #  -----  Error Page  -----  #
    #  ------------------------  #

    error_page 404 /404.html;

    access_log /var/log/nginx/jquery.antonydev.tech.access.log;
    error_log /var/log/nginx/jquery.antonydev.tech.error.log;
}
