# ==============================================================
#  nginx — /api/ de mis-frameworks-spa.antonydev.tech
#  Fragmento para el server {} del subdominio
#  --------------------------------------------------------------
#  - Va DENTRO del server {} de mis-frameworks-spa.antonydev.tech.
#  - Copiar a /etc/nginx/snippets/mis-frameworks-spa.antonydev.tech-api.conf
#  - Con SITE_BASE=/framework-spa-with-jquery-and-vanilla las páginas piden
#    .../framework-spa-with-jquery-and-vanilla/api/ (relativo al <base>).
#  - proxy_pass termina en "/" para quitar el prefijo /api/:
#    /api/health       -> http://127.0.0.1:3200/health
#    /api/tasks        -> http://127.0.0.1:3200/tasks
#    /api/mysql/query  -> http://127.0.0.1:3200/mysql/query
# ==============================================================

location ^~ /framework-spa-with-jquery-and-vanilla/api/ {
    proxy_pass http://127.0.0.1:3200/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}