# ==============================================================
#  nginx — site file de mis-frameworks-spa.antonydev.tech
#  --------------------------------------------------------------
#  - Va en /etc/nginx/sites-available/mis-frameworks-spa.antonydev.tech
#    con symlink en sites-enabled.
#  - Raíz del dominio: /var/www/mis-frameworks-spa.antonydev.tech/index.html (hub; pendiente).
#  - Este demo: /framework-spa-with-jquery-and-vanilla/ — SITE_BASE igual (sin / final).
#    deploy.sh sube dist/ a .../framework-spa-with-jquery-and-vanilla/ (+ .env).
#  - Incluir el fragmento API desde snippets/ antes de reload.
#  - Tras Certbot, conservar listen/ssl del archivo generado; este bloque
#    resume el server {} HTTPS con PHP-FPM y la SPA.
# ==============================================================

server {
    listen 80;
    listen [::]:80;
    server_name mis-frameworks-spa.antonydev.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mis-frameworks-spa.antonydev.tech;

    ssl_certificate /etc/letsencrypt/live/mis-frameworks-spa.antonydev.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mis-frameworks-spa.antonydev.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/mis-frameworks-spa.antonydev.tech;

    include snippets/deny-dotfiles.conf;

    include /etc/nginx/snippets/mis-frameworks-spa.antonydev.tech-api.conf;

    #  ----------------------------------------------------------------------------------------------  #
    #  -----  raíz del subdominio — landing / hub (index.html en el root; aún no desplegado)  -----  #
    #  ----------------------------------------------------------------------------------------------  #

    location = / {
        try_files /index.html =404;
    }

    #  ----------------------------------------------------------------------------------------------  #
    #  -----  .../framework-spa-with-jquery-and-vanilla/ (SITE_BASE en .env del build)  -----  #
    #  ----------------------------------------------------------------------------------------------  #

    location = /framework-spa-with-jquery-and-vanilla {
        return 301 /framework-spa-with-jquery-and-vanilla/;
    }

    location ^~ /framework-spa-with-jquery-and-vanilla/ {
        try_files $uri $uri/ /framework-spa-with-jquery-and-vanilla/index.html;

        location ~ /\.env {
            deny all;
            return 404;
        }

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_param QUERY_STRING $query_string;
        }
    }
}