<!DOCTYPE html>
<html lang="es">


<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Framework SPA with jQuery and Vanilla JS/TS — monorepo de paquetes spa-build, spa-server, jq-spa-core y demo del plugin jQuery v5. AntonyDev.">

       
    <!--  -----  Base del Proyecto  -----  -->
    <base href="%SITE_BASE%/">
   
     <!--  -----  Favicon  -----  -->
     <link rel="icon" href="app/assets/favicon/jquery-icon.svg" type="image/svg+xml">

    <!--  ----------  Configuración móvil  ----------  -->
    <meta name="theme-color" content="#c3c4f9">
        
    <!--  -----  Themes jQuery UI (framework jq-spa-core)  -----  -->
    <link rel="preload" href="app/framework/jq-spa-core/libs/jquery/ui/themes/base/jquery-ui.min.css" as="style">
    <link rel="stylesheet" href="app/framework/jq-spa-core/libs/jquery/ui/themes/base/jquery-ui.min.css" id="theme">

    <!--  -----  Styles Globales  -----  -----  -->
    <link rel="preload" href="app/css/globals.css" as="style">
    <link rel="stylesheet" href="app/css/globals.css">
        

</head>


<body>
    

    <!--  ----------  LOADER  ----------  -->
    <div class="loader__container" id="loader">

        <h1 class="loader__title-main"> 
            &lt; Framework SPA With jQuery and Vanilla JS/TS /&gt; 
        </h1>

        <div class="spinner"> 
            <!--  *****  Spinner  *****  -->
        </div>

        <img
            class="loader__icon-jquery"
            src="app/assets/img/logos/jquery/jquery-loader.svg"
            alt="jQuery Animation Loader"
            width="300"
            height="300"
        >

        <h2 class="loader__title-main"> 
            &lt; Mis Plugins SPA /&gt;
        </h2>

    </div>


    <!--  ----------  LAYOUT  ----------  -->
    <div class="layout" id="layout">

        
        <!--  ----------  LAYOUT HEADER  ----------  -->
        <header class="layout__header" id="layoutHeader"> 
            <!--  *****  Renderizado del Header  *****  -->
        </header>

                   
        <!--  -----  LAYOUT BTN-NAVBAR  -----  -->
        <div class="layout__btn-navbars" id="btnNavbar">
            <!--  *****  Renderizado del Botón del Navbar  *****  -->
        </div>

        <!--  -----  LAYOUT BTN-NAVBAR THEMES JQUERY UI  -----  -->
        <div class="layout__btn-navbars-themes-jquery-ui" id="btnNavbarThemesJQueryUI">
            <!--  *****  Renderizado del Botón del Navbar de los temas de jQuery UI  *****  -->
        </div>
                   
        
        <!--  ----------  LAYOUT NAVBAR  ----------  -->
        <nav class="layout__navbar" id="layoutNavbar"> 
            <!--  *****  Renderizado del Navbar  *****  -->
        </nav>

        <!--  ----------  LAYOUT NAVBAR THEMES JQUERY UI  ----------  -->
        <nav class="layout__navbar draggable" id="layoutNavbarThemesUI">
            <!--  *****  Renderizado del Navbar Themes jQuery UI  *****  -->
        </nav>
       

        <!--  ----------  LAYOUT MAIN  ----------  -->
        <main class="layout__main" id="layoutMain"> 
            <!--  *****  Renderizado del Main  *****  -->
        </main>


        <!--  ----------  LAYOUT FOOTER  ----------  -->
        <footer class="layout__footer" id="layoutFooter"> 
            <!--  *****  Renderizado del Footer  *****  -->
        </footer>

        
    </div>


    <!--  -----  Import map (antes del entry module; rutas relativas al base href)  -----  -->
    <script type="importmap">
    {
        "imports": {
            "@antonydev/jq-spa-core": "./app/framework/jq-spa-core/start.js",
            "@antonydev/jq-spa-core/": "./app/framework/jq-spa-core/",
            "@antonydev/spa-loading-effect": "./app/framework/spa-loading-effect/effect-loading-page.js"
        }
    }
    </script>

    <!--  -----  Script Main  -----  -->
    <script type="module" src="app/main.js"> </script>


</body>

</html>
